name: Test

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Unit + Integration Tests (coverage)
        run: npm run test:run


      - name: Asset reference audit
        run: npm run assets:audit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
